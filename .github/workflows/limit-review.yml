name: Archive daily limit-up review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_low_absorption.py
      - scripts/market_history.py
      - .github/workflows/limit-review.yml
  schedule:
    # 15:20 and 16:10 China time; later attempt may add disclosed LHB rows.
    - cron: '20 7 * * 1-5'
    - cron: '10 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-market.txt
      - run: pip install -r scripts/requirements-market.txt playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python scripts/build_limit_review.py
      - name: Build end-of-day low absorption radar
        id: radar
        continue-on-error: true
        run: |
          git fetch origin market-data
          git worktree add --detach /tmp/dragon-market-data origin/market-data
          day="$(TZ=Asia/Shanghai date +%F)"
          timeout 6m python scripts/build_low_absorption.py --archive-dir /tmp/dragon-market-data --today "/tmp/limit-review/$day.json" --out /tmp/low-absorption
      - name: Capture full infographic
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright
          path = Path('/tmp/limit-review') / (datetime.now(ZoneInfo('Asia/Shanghai')).strftime('%Y-%m-%d') + '.html')
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1500, 'height': 1000}, device_scale_factor=2)
              page.goto(path.as_uri())
              page.screenshot(path=str(path.with_suffix('.png')), full_page=True)
              browser.close()
          PY
      - name: Publish dated archive and latest pointer
        run: |
          set -euo pipefail
          day="$(TZ=Asia/Shanghai date +%F)"
          year="${day:0:4}"
          month="${day:5:2}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin market-data
          git checkout -B market-data origin/market-data
          mkdir -p "daily/$year/$month"
          cp "/tmp/limit-review/$day.json" "/tmp/limit-review/$day.html" "/tmp/limit-review/$day.png" "daily/$year/$month/"
          cp "/tmp/limit-review/$day.json" latest-limit-review.json
          git add "daily/$year/$month" latest-limit-review.json
          if [ -f "/tmp/low-absorption/radar/$year/$month/$day.json" ] && [ -f /tmp/low-absorption/trading-calendar.json ]; then
            mkdir -p "radar/$year/$month"
            cp "/tmp/low-absorption/radar/$year/$month/$day.json" "radar/$year/$month/"
            cp /tmp/low-absorption/trading-calendar.json trading-calendar.json
            git add "radar/$year/$month" trading-calendar.json
            if [ -f "/tmp/low-absorption/research/$year/$month/$day.json" ]; then
              mkdir -p "research/$year/$month"
              cp "/tmp/low-absorption/research/$year/$month/$day.json" "research/$year/$month/"
              git add "research/$year/$month/$day.json"
            fi
          else
            echo '::warning::Daily radar unavailable; original archive preserved, no fabricated calendar or prices.'
          fi
          if ! git diff --cached --quiet; then
            git commit -m "market: archive limit-up review $day"
            git push origin HEAD:market-data
          fi

      - name: Verify radar publication health
        if: always()
        run: |
          python - <<'PYHEALTH'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          day = datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y/%m/%Y-%m-%d.json")
          root = Path("/tmp/low-absorption")
          radar = json.loads((root / "radar" / day).read_text())
          report = json.loads((root / "research" / day).read_text())
          valid = sum("error" not in s for s in radar["stocks"])
          print(f"雷达健康：{valid}/{len(radar['stocks'])}有当日日线；研究事件{len(report['rows'])}")
          if radar["stocks"] and not valid:
              raise SystemExit("所有候选行情缺失；原涨停归档已保留，但雷达采集不可标为成功")
          PYHEALTH
