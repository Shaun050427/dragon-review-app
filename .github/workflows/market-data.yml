name: Update yesterday limit-up premium

on:
  workflow_dispatch:
  schedule:
    # UTC: China market; first attempt at 09:27 China time, then every 5 minutes.
    - cron: '2/5 1-3,5-7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: yesterday-premium
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-market.txt
      - run: pip install -r scripts/requirements-market.txt
      - run: python scripts/update_yesterday_premium.py
      - name: Publish snapshot on separate branch without triggering site rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin market-data >/dev/null; then
            git fetch origin market-data
            git checkout -B market-data origin/market-data
          else
            git checkout --orphan market-data
            git rm -rf --cached . >/dev/null
          fi
          cp /tmp/yesterday-premium.json yesterday-premium.json
          git add yesterday-premium.json
          git commit -m "market: yesterday limit-up snapshot $(date -u +%FT%TZ)"
          git push origin HEAD:market-data
