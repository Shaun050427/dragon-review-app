name: Validate application
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/check_low_absorption.mjs
      - run: node scripts/check_liquidity_plan.mjs && node scripts/check_strategy_research.mjs && node scripts/check_trade_certainty.mjs
      - run: python -m unittest discover -s scripts -p 'test_low_absorption.py'
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /dragon-review-app
